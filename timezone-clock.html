<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #00d4ff;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00d4ff;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.2);
        }

        .clock:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4);
            transform: translateY(-5px);
        }

        .timezone-label {
            color: #00d4ff;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .time-display {
            font-size: 2em;
            color: #00ff88;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .date-display {
            font-size: 0.85em;
            color: #aaaaaa;
        }

        .utc-time {
            background: rgba(0, 212, 255, 0.1);
            border-top: 1px solid rgba(0, 212, 255, 0.3);
            margin-top: 20px;
            padding-top: 20px;
        }

        .utc-label {
            color: #00d4ff;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .utc-display {
            font-size: 1.8em;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            font-weight: bold;
        }

        .footer {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }

            .time-display {
                font-size: 1.5em;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Multi-Timezone Clock</h1>
        
        <div class="clocks-grid" id="clocksContainer"></div>
        
        <div class="utc-time">
            <div class="utc-label">Coordinated Universal Time (UTC)</div>
            <div class="utc-display" id="utcClock">--:--:--</div>
        </div>

        <div class="footer">
            <p>Clock updates every second • All times shown in 24-hour format</p>
        </div>
    </div>

    <script>
        // Define timezones to display
        const timezones = [
            { name: 'New York (EST)', zone: 'America/New_York' },
            { name: 'London (GMT)', zone: 'Europe/London' },
            { name: 'Paris (CET)', zone: 'Europe/Paris' },
            { name: 'Tokyo (JST)', zone: 'Asia/Tokyo' },
            { name: 'Sydney (AEDT)', zone: 'Australia/Sydney' },
            { name: 'Dubai (GST)', zone: 'Asia/Dubai' },
            { name: 'Hong Kong (HKT)', zone: 'Asia/Hong_Kong' },
            { name: 'Singapore (SGT)', zone: 'Asia/Singapore' },
            { name: 'Los Angeles (PST)', zone: 'America/Los_Angeles' },
            { name: 'Toronto (EST)', zone: 'America/Toronto' },
            { name: 'São Paulo (BRT)', zone: 'America/Sao_Paulo' },
            { name: 'Mumbai (IST)', zone: 'Asia/Kolkata' }
        ];

        // Function to pad numbers with leading zero
        function padZero(num) {
            return num.toString().padStart(2, '0');
        }

        // Function to format time
        function formatTime(date) {
            const hours = padZero(date.getHours());
            const minutes = padZero(date.getMinutes());
            const seconds = padZero(date.getSeconds());
            return `${hours}:${minutes}:${seconds}`;
        }

        // Function to format date
        function formatDate(date) {
            const year = date.getFullYear();
            const month = padZero(date.getMonth() + 1);
            const day = padZero(date.getDate());
            return `${year}-${month}-${day}`;
        }

        // Function to update all clocks
        function updateClocks() {
            const now = new Date();

            // Update UTC clock
            document.getElementById('utcClock').textContent = formatTime(now);

            // Update timezone clocks
            timezones.forEach((tz, index) => {
                const formatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: tz.zone,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });

                const parts = formatter.formatToParts(now);
                const timeObj = {};
                parts.forEach(part => {
                    timeObj[part.type] = part.value;
                });

                const time = `${timeObj.hour}:${timeObj.minute}:${timeObj.second}`;
                const date = `${timeObj.year}-${timeObj.month}-${timeObj.day}`;

                const clockElement = document.getElementById(`clock-${index}`);
                if (clockElement) {
                    clockElement.querySelector('.time-display').textContent = time;
                    clockElement.querySelector('.date-display').textContent = date;
                }
            });
        }

        // Function to initialize clocks
        function initializeClocks() {
            const container = document.getElementById('clocksContainer');
            container.innerHTML = '';

            timezones.forEach((tz, index) => {
                const clockDiv = document.createElement('div');
                clockDiv.className = 'clock';
                clockDiv.id = `clock-${index}`;
                clockDiv.innerHTML = `
                    <div class="timezone-label">${tz.name}</div>
                    <div class="time-display">--:--:--</div>
                    <div class="date-display">----/--/--</div>
                `;
                container.appendChild(clockDiv);
            });

            // Initial update
            updateClocks();
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            initializeClocks();
            // Update every 1000ms (1 second)
            setInterval(updateClocks, 1000);
        });
    </script>
</body>
</html>
